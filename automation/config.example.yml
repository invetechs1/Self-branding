# انسخ هذا الملف إلى config.yml وعبّئ القيم.
# config.yml مدرج في .gitignore — لا يُرفع إلى GitHub أبداً.

anthropic:
  api_key: "sk-ant-..."
  model: "claude-sonnet-5"

twitter:
  # X API v2 — OAuth 1.0a user context (خطة Basic أو أعلى)
  api_key: ""
  api_secret: ""
  access_token: ""
  access_token_secret: ""

instagram:
  # Meta Graph API — حساب Instagram Business مربوط بصفحة Facebook
  access_token: ""
  ig_user_id: ""

tiktok:
  # TikTok Content Posting API
  access_token: ""

linkedin:
  access_token: ""
  person_urn: ""   # urn:li:person:xxxx

# بديل: منصة جدولة خارجية بدل الـ APIs المباشرة
buffer:
  access_token: ""

settings:
  timezone: "Asia/Riyadh"
  require_approval: true        # لا تغيّرها إلى false في أول 3 أشهر
  auto_publish_green: false     # حتى لو صارت true، الأصفر والأحمر يظلان بمراجعة بشرية (§37)
  default_language: "ar"        # ar أو en — تتجاوز persona.yml → voice.default_language

# محرك الأخبار — العتبات والأوزان الأساسية في profile/persona.yml
news:
  posts_per_run: 3              # عدد عناقيد الأخبار التي تتحول إلى محتوى في كل دورة
  platforms: ["linkedin_post", "twitter_thread", "twitter"]
  limit_per_feed: 25            # حد الأخبار المقروءة من كل مصدر في الدورة الواحدة
  # مزوّد أخبار مدفوع (اختياري) بدل/إضافةً إلى RSS — انظر docs/technical-requirements.md §5
  newsapi_key: ""
  gdelt_enabled: false
