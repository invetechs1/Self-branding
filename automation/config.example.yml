# انسخ هذا الملف إلى config.yml وعبّئ القيم.
# config.yml مدرج في .gitignore — لا يُرفع إلى GitHub أبداً.

anthropic:
  api_key: "sk-ant-..."
  model: "claude-sonnet-5"

twitter:
  # X API v2 — OAuth 1.0a user context (خطة Basic أو أعلى)
  api_key: ""
  api_secret: ""
  access_token: ""
  access_token_secret: ""

instagram:
  # Meta Graph API — حساب Instagram Business مربوط بصفحة Facebook
  access_token: ""
  ig_user_id: ""

tiktok:
  # TikTok Content Posting API — راجع automation/README.md § ربط تيك توك
  # 1) أنشئ تطبيقاً على developers.tiktok.com واطلب منتج Content Posting API
  # 2) فعّل الصلاحيات: user.info.basic + video.upload  (و video.publish للنشر المباشر)
  # 3) سجّل رابط التحويل أدناه نفسه في إعدادات التطبيق
  # 4) شغّل: python automation/tiktok_auth.py   (يملأ access_token و refresh_token تلقائياً)
  client_key: ""
  client_secret: ""
  redirect_uri: "http://127.0.0.1:8721/callback"
  access_token: ""        # يُملأ ويُجدَّد تلقائياً (صالح 24 ساعة)
  refresh_token: ""       # يُملأ تلقائياً (صالح سنة)
  mode: "inbox"           # inbox = يصل إلى مسودات تطبيقك فتنشره بنفسك (بلا تدقيق)
                          # direct = نشر مباشر (يتطلب تدقيق تيك توك للتطبيق)
  privacy_level: "SELF_ONLY"   # للنشر المباشر: SELF_ONLY قبل التدقيق، ثم PUBLIC_TO_EVERYONE
  disable_comment: false
  disable_duet: false
  disable_stitch: false

linkedin:
  access_token: ""
  person_urn: ""   # urn:li:person:xxxx

# بديل: منصة جدولة خارجية بدل الـ APIs المباشرة
buffer:
  access_token: ""

settings:
  timezone: "Asia/Riyadh"
  require_approval: true        # لا تغيّرها إلى false في أول 3 أشهر
  auto_publish_green: false     # حتى لو صارت true، الأصفر والأحمر يظلان بمراجعة بشرية (§37)
  default_language: "ar"        # ar أو en — تتجاوز persona.yml → voice.default_language

# محرك الأخبار — العتبات والأوزان الأساسية في profile/persona.yml
news:
  posts_per_run: 3              # عدد عناقيد الأخبار التي تتحول إلى محتوى في كل دورة
  platforms: ["linkedin_post", "twitter_thread", "twitter"]
  limit_per_feed: 25            # حد الأخبار المقروءة من كل مصدر في الدورة الواحدة
  # مزوّد أخبار مدفوع (اختياري) بدل/إضافةً إلى RSS — انظر docs/technical-requirements.md §5
  newsapi_key: ""
  gdelt_enabled: false
