# صفحات أخبار الجهات الحكومية — أثمن مصدر لجمهورك، وأكثرها افتقاراً إلى RSS
# ─────────────────────────────────────────────────────────────────────────
# لكل جهة:
#   url       صفحة الأخبار
#   selectors (اختياري) محددات CSS: item / title / link / date
#             اتركها فارغة ليعمل الاستخراج التلقائي، ثم ثبّتها بعد --probe
#   keywords  كلمات تُرجّح أن العنصر خبر يهم جمهورك (لا تمنع غيره، ترفع ترتيبه)
#   topic     وصف قصير يظهر في المخرجات
#
# ⚠️ بنية صفحات المواقع تتغيّر. افحص كل جهة على جهازك قبل الاعتماد:
#     python automation/gov_watch.py --probe hrsd
#     python automation/gov_watch.py --check          # فحص كل الجهات دفعة واحدة

