  - {name: "وزارة التجارة", url: "https://mc.gov.sa/ar/mediacenter/News", type: official_government, topic: "السجل التجاري · الأنظمة التجارية · الغش"}
  - {name: "هيئة الزكاة والضريبة والجمارك", url: "https://zatca.gov.sa/ar/MediaCenter/News", type: official_government, topic: "الفاتورة الإلكترونية · الضريبة · الجمارك"}
  - {name: "وزارة البلديات والإسكان", url: "https://momah.gov.sa/ar/news", type: official_government, topic: "رخص البناء · الاشتراطات البلدية · الإسكان"}
  - {name: "الهيئة السعودية للمقاولين", url: "https://sca.gov.sa/ar/news", type: official_government, topic: "تصنيف المقاولين · العقد الموحد · حماية المقاول"}
  - {name: "كود البناء السعودي (SBC)", url: "https://sbc.gov.sa/ar/News", type: official_government, topic: "اشتراطات البناء · السلامة الإنشائية"}
  - {name: "الهيئة السعودية للمهندسين", url: "https://www.saudieng.sa/Arabic/MediaCenter", type: official_government, topic: "تصنيف المهندسين · الممارسة المهنية"}
  - {name: "سدايا — هيئة البيانات والذكاء الاصطناعي", url: "https://sdaia.gov.sa/ar/MediaCenter/News", type: official_government, topic: "سياسات الذكاء الاصطناعي · البيانات"}
  - {name: "هيئة المحتوى المحلي والمشتريات الحكومية", url: "https://lcgpa.gov.sa/ar/MediaCenter", type: official_government, topic: "المحتوى المحلي · تفضيل المنتج الوطني"}
  - {name: "منصة اعتماد", url: "https://etimad.sa", type: official_government, topic: "المنافسات الحكومية · الترسيات"}
  - {name: "موسم الرياض / هيئة الترفيه", url: "https://riyadhseason.sa", type: official_company, topic: "المناسبات والفعاليات"}
