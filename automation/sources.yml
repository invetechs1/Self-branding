# مصادر الاكتشاف — سعودية عربية أولاً (§18)
#
# ⚠️ روابط RSS تتغيّر وتتعطّل. تحقّق منها على جهازك قبل الاعتماد:
#     python automation/news_engine.py --check-sources
#   احذف الفاشل أو استبدله. المصادر التي بلا RSS مدرجة تحت manual_watch.
#
# kind: news (افتراضي) | trend (مؤشرات بحث/تداول — إشارة لا خبر، لا تُنشر كما هي)
# type: يحدد المصداقية من profile/persona.yml → source_credibility

feeds:
  # ═══ سعودي رسمي ═══
  - {name: "واس — وكالة الأنباء السعودية", url: "https://www.spa.gov.sa/rss.xml", type: official_government, region: saudi_arabia, lang: ar}

  # ═══ صحف واقتصاد سعودي ═══
  - {name: "أرقام", url: "https://www.argaam.com/ar/rss", type: industry_publication, region: saudi_arabia, lang: ar}
  - {name: "الاقتصادية", url: "https://www.aleqt.com/rss", type: industry_publication, region: saudi_arabia, lang: ar}
  - {name: "مال", url: "https://www.maaal.com/feed", type: industry_publication, region: saudi_arabia, lang: ar}
  - {name: "سبق", url: "https://sabq.org/rss", type: industry_publication, region: saudi_arabia, lang: ar}
  - {name: "عاجل", url: "https://ajel.sa/rss", type: industry_publication, region: saudi_arabia, lang: ar}
  - {name: "المواطن", url: "https://www.almowaten.net/feed/", type: industry_publication, region: saudi_arabia, lang: ar}
  - {name: "اليوم", url: "https://www.alyaum.com/rss", type: industry_publication, region: saudi_arabia, lang: ar}
  - {name: "العربية — أسواق", url: "https://www.alarabiya.net/.mrss/ar/aswaq.xml", type: major_international_publication, region: gcc, lang: ar}

  # ═══ الترند السعودي (إشارات لا أخبار) ═══
  - {name: "الأكثر بحثاً في السعودية — Google Trends", url: "https://trends.google.com/trending/rss?geo=SA", type: social_media, region: saudi_arabia, lang: ar, kind: trend}

  # ═══ مقاولات وإنشاءات (عربي/خليجي) ═══
  - {name: "Construction Week — الشرق الأوسط", url: "https://www.constructionweekonline.com/rss", type: industry_publication, region: gcc, lang: en}
  - {name: "Zawya — مشاريع المنطقة", url: "https://www.zawya.com/en/rss", type: industry_publication, region: gcc, lang: en}

  # ═══ ذكاء اصطناعي عالمي (يُربط بالسوق السعودي عند الكتابة) ═══
  - {name: "TechCrunch", url: "https://techcrunch.com/feed/", type: major_international_publication, region: united_states, lang: en}
  - {name: "VentureBeat AI", url: "https://venturebeat.com/category/ai/feed/", type: major_international_publication, region: united_states, lang: en}
  - {name: "Google AI Blog", url: "https://blog.google/technology/ai/rss/", type: official_company, region: global, lang: en}

  # ═══ تقنية الإنشاءات عالمياً (مرجع للمقارنة) ═══
  - {name: "Construction Dive", url: "https://www.constructiondive.com/feeds/news/", type: industry_publication, region: united_states, lang: en}
  - {name: "BIM+", url: "https://www.bimplus.co.uk/feed/", type: industry_publication, region: europe, lang: en}

# ═══ جهات بلا RSS — تُتابَع يدوياً أو عبر كشط مجدول (انظر docs/technical-requirements.md §5) ═══
# هذه أثمن المصادر لجمهورك: قراراتها تمسّ المقاول والموظف مباشرةً.
manual_watch:
