# رزنامة المناسبات السعودية — يقرؤها النظام ليقترح المحتوى قبل المناسبة لا بعدها
# ─────────────────────────────────────────────────────────────────────────────
# lead_days: كم يوماً قبل المناسبة يبدأ النظام باقتراح المحتوى
# angle: الزاوية التي تربط المناسبة بتخصصك — لا تهنئة عامة، بل محتوى يضيف قيمة
# kind: fixed (تاريخ ميلادي ثابت) | hijri (يُحسب بالتقويم الهجري) | season (موسم ممتد)

occasions:

  - key: founding_day
    name: "يوم التأسيس"
    kind: fixed
    month: 2
    day: 22
    lead_days: 10
    pillar: occasions
    angle: "ثلاثة قرون من البناء: كيف تطوّر العمران السعودي من الطين إلى المشاريع الكبرى — وماذا يعني ذلك لمقاول اليوم"

  - key: flag_day
    name: "يوم العلم السعودي"
    kind: fixed
    month: 3
    day: 11
    lead_days: 7
    pillar: occasions
    angle: "الهوية في المشاريع: ماذا يعني أن يُبنى المشروع بأيدٍ وكفاءات وطنية"

  - key: labour_day
    name: "اليوم العالمي للسلامة والصحة المهنية"
