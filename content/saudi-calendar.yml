# مواعيد إدارية متكررة تهم جمهورك (شهرية/سنوية)
recurring_reminders:
  - {name: "إقرار ضريبة القيمة المضافة", cadence: "شهري/ربعي", angle: "الفاتورة الإلكترونية في المقاولات: الأخطاء التي تكلّف غرامات"}
  - {name: "تحديث شهادة الزكاة", cadence: "سنوي", angle: "لماذا تتعطل مستخلصاتك بسبب شهادة منتهية — وكيف تسبق الموعد"}
  - {name: "تجديد تصنيف المقاولين", cadence: "دوري", angle: "ما الذي يرفع درجة تصنيفك فعلياً: ملف المشاريع، الكوادر، والملاءة"}
  - {name: "نسب التوطين (نطاقات)", cadence: "مستمر", angle: "حساب نسبة التوطين في شركة مقاولات دون تعطيل التنفيذ"}
