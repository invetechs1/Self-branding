# رادار الردود — أين يستحق صوتك أن يظهر اليوم
# ═══════════════════════════════════════════════════════════════════════════
# استراتيجيتك تنص على «10 ردود ذكية يومياً»، والرد الذكي على حساب كبير يصل أحياناً
# أكثر من منشور كامل على حسابك. هذا الملف يحدد أين يبحث النظام.
#
# ⚠️ النظام يقترح فقط ولا يرد أبداً. الرد الآلي مخالف لشروط المنصات ويحرق الحساب،
#    ولا توجد في الكود دالة نشر رد إطلاقاً — الضمان بنيوي لا وعد.
#
# طريقتان للاكتشاف، تعملان معاً:
#   search_terms  تعمل فوراً بلا إعداد — بحث بكلماتك في منشورات حديثة
#   accounts      أدقّ — املأها بحسابات تتابعها فعلاً (بلا @)

# ─── البحث بالكلمات (جاهز للعمل الآن) ───
search_terms:
  - "تصنيف المقاولين"
  - "العقد الموحد"
  - "مستخلصات المقاولين"
  - "تأخر المشاريع"
  - "كود البناء السعودي"
  - "سلامة المواقع"
  - "نطاقات التوطين"
  - "منصة قوى"
  - "التأمينات الاجتماعية المقاولات"
  - "الذكاء الاصطناعي الإنشاءات"
  - "إدارة المشاريع السعودية"
  - "مشاريع الرياض"

# ─── الحسابات (املأها بنفسك — لم أضع حسابات لم أتحقق منها) ───
accounts:
  government: []      # جهات رسمية: الموارد البشرية، التأمينات، هيئة المقاولين ...
  industry: []        # شركات مقاولات واستشارات وقادة القطاع
  contech: []         # تقنية الإنشاءات والذكاء الاصطناعي
  investors: []       # مستثمرون وصناديق ومحللون
  media: []           # صحفيون وحسابات إعلام اقتصادي

# ─── ضوابط الاختيار ───
rules:
  max_suggestions_per_day: 10   # يطابق الإيقاع في strategy/04
  max_age_hours: 6              # الرد بعد ذلك يضيع — النافذة الذهبية أول ساعتين
  min_engagement: 5             # تجاهل ما لا أحد يراه
  skip_if_replied: true         # لا يُقترح منشور رددت عليه سابقاً
  avoid_controversy: true       # تجاوز السياسي والجدلي والشخصي (safety في persona.yml)
