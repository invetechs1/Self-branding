# أرقامك التشغيلية — المحتوى الوحيد الذي لا يستطيع أحد نسخه
# ═══════════════════════════════════════════════════════════════════════════
# منافسوك ينقلون الأخبار نفسها. الشيء الذي تملكه وحدك: ما تقيسه فعلاً في عزوم
# والعراب. منشور واحد مبني على رقم حقيقي من عملك يساوي عشرة منشورات رأي.
#
# ─── قواعد لا تُكسر (يفرضها الكود لا الثقة) ───
#  1. لا أسماء عملاء، ولا أسماء مشاريع، ولا قيم عقود، ولا إيرادات ولا أرباح.
#  2. نِسب ومُدد وأعداد فقط — لا مبالغ مالية مطلقة.
#  3. كل رقم يحتاج أساساً (basis): من كم مشروعاً/مستخلصاً/حالة استُخرج.
#     رقم من حالة واحدة ليس بياناً، وقد يكشف مشروعاً بعينه.
#  4. الحد الأدنى للتجميع: 5 حالات. ما دونها يُرفض تلقائياً.
#  5. sensitivity يحدد المصير:
#       safe     → يجوز بناء محتوى عليه (بعد مراجعتك دائماً)
#       internal → يظهر في تقاريرك الخاصة فقط، لا يخرج في منشور أبداً
#       never    → لا يُقرأ ولا يُستخدم إطلاقاً
#  6. لا منشور بيانات يُنشر آلياً مهما كان تصنيفه — مراجعتك إلزامية دائماً.
#
# ─── كيف تملأه ───
# القيم أدناه null عمداً: النظام لا يخترع رقماً، ويرفض أي بند بلا قيمة أو بلا أساس.
# ابدأ بثلاثة أرقام تعرفها اليوم بلا بحث. البقية تأتي لاحقاً.

metrics:

