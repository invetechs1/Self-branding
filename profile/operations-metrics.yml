    basis: null            # مثال: "من 18 مستخلصاً خلال 2026"
    period: null           # مثال: "2026"
    sensitivity: safe
    angle: "التدفق النقدي هو القاتل الصامت للمقاول — والرقم يثبت أنه ليس شعوراً"

  - key: change_orders_ratio
