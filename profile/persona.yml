# ── المبدأ الحاكم (§53) ──
governing_principle: >-
  لا تسأل: "ماذا ننشر اليوم؟" بل: "ماذا حدث في العالم اليوم ويجب أن يفهمه يحيى،
  وما الزاوية الفريدة التي يمكنه إضافتها، وكيف تقوّي هذه الرؤية سمعته وتصنع قيمة أعمال طويلة المدى؟"
