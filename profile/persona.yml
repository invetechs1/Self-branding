# ── قواعد السلامة (§33-37) ──
safety:
  originality_rule: "SOURCE → UNDERSTAND → VERIFY → ANALYZE → ADD PERSPECTIVE → CREATE ORIGINAL POST — لا نسخ ولا تلخيص حرفي"
  personal_experience_rule: "يُمنع اختراع تجربة شخصية. غير الموجود في facts.yml يُصاغ: (هذا ما يجب أن تفحصه الشركات في قطاعنا)"
  opinion_rule: "الرأي غير الموثّق سابقاً يُقدَّم كـ Suggested Opinion ويحتاج اعتماداً"
  never_expose:
    - "عقود سرية"
    - "أسعار العملاء"
    - "نزاعات داخلية"
    - "بيانات الموظفين"
    - "معلومات بنكية"
    - "معلومات مالية خاصة"
    - "استراتيجية قانونية"
    - "مستندات مشاريع سرية"
    - "شؤون عائلية"
  approval_levels:
    green:  "معلومة عامة موثّقة أو محتوى تعليمي — يجوز نشره آلياً وفق الإعدادات"
    yellow: "رأي أو توقع أو تعليق تجاري — يحتاج مراجعة"
    red:    "معلومات حساسة/مالية/قانونية/جدلية/شخصية/غير موثّقة — لا نشر آلي إطلاقاً"
  red_flag_terms:
    ["revenue", "profit margin", "lawsuit", "legal action", "contract value", "salary", "بنك",
     "إيرادات", "أرباح", "قضية", "دعوى", "راتب", "سياسة", "political", "دين", "خلاف"]
  yellow_flag_terms:
    ["i think", "i believe", "will likely", "prediction", "أتوقع", "برأيي", "أعتقد", "سيصبح", "خلال السنوات القادمة"]

