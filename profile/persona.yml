  business_relevance: 20
  saudi_gcc_relevance: 15
  strategic_importance: 15
  audience_value: 10
  freshness: 10
  source_credibility: 5

thresholds:
  pipeline_entry: 55        # أقل درجة ملاءمة تدخل خط إنتاج المحتوى
  deep_dive: 78             # درجة تستحق تحليلاً معمقاً (مقال/ثريد)
  duplicate_similarity: 0.55 # عتبة تشابه العناوين لاعتبارها قصة واحدة
  min_credibility_for_facts: 80  # ادعاء رقمي/مالي يتطلب مصدراً بهذه المصداقية
  fact_confidence_autopublish: 0.8   # أقل من ذلك = مراجعة (أصفر)
  fact_confidence_red: 0.6           # أقل من ذلك = اعتماد يدوي إلزامي (أحمر)
  freshness_half_life_hours: 24
  freshness_max_age_hours: 168

